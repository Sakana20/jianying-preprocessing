[project]
name = "jianying-preprocessing"
version = "0.1.0"
description = "Deterministic preprocessing for JianYing 5.9 draft bundles"
requires-python = ">=3.10"

[project.scripts]
jypre = "jypre.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["jypre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
